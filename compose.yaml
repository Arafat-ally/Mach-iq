services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchiq
      POSTGRES_USER: matchiq
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U matchiq"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  prediction:
    build: ./prediction
    environment:
      PORT: 8000
      PREDICTION_SERVICE_KEY: ${PREDICTION_SERVICE_KEY:?Set PREDICTION_SERVICE_KEY}
  api: &backend
    build: ./backend
    env_file: backend/.env
    environment: &environment
      DB_HOST: postgres
      DB_CONNECTION: pgsql
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      PREDICTION_ENGINE_URL: http://prediction:8000
      PREDICTION_SERVICE_KEY: ${PREDICTION_SERVICE_KEY:?Set PREDICTION_SERVICE_KEY}
      PORT: 8080
    ports: ["8000:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *backend
    ports: []
    environment:
      <<: *environment
      SERVICE_ROLE: worker
  scheduler:
    <<: *backend
    ports: []
    environment:
      <<: *environment
      SERVICE_ROLE: scheduler
volumes:
  pgdata:
  redisdata:
